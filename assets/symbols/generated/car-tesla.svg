<rect x="72" y="122" width="96" height="9" fill="#c8432c"/>
<rect x="72" y="140" width="96" height="9" fill="#c8432c"/>
<rect x="72" y="158" width="96" height="9" fill="#c8432c"/>
<rect x="72" y="104" width="43" height="36" fill="#2c4f8f"/>
    <rect x="40" y="236" width="56" height="200" rx="14" fill="#3f9a3a"/>
    <path d="M74 270 L58 312 L72 312 L62 350 L84 300 L70 300 Z" fill="#f2c230"/>
    <path d="M90 400 Q120 460 150 380 Q160 352 168 330" stroke="#33302e" stroke-width="12" stroke-linecap="round" fill="none"/>
